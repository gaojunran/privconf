name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test e2e -- --test-threads=1

  release:
    name: Release ${{ matrix.target }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: privconf-x86_64-linux
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: privconf-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: privconf-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: privconf-aarch64-macos
    steps:
      - uses: actions/checkout@v4

      # Linux musl 静态编译：用 zig 作为 linker，产出与 glibc 无关的静态二进制
      - name: Install Zig
        if: endsWith(matrix.target, '-linux-musl')
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: endsWith(matrix.target, '-linux-musl')
        run: pipx install cargo-zigbuild

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Verify static linkage
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          file target/${{ matrix.target }}/release/privconf
          ldd target/${{ matrix.target }}/release/privconf || true

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact }}.tar.gz privconf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}.tar.gz

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
